name: SeekES
options:
  bundleIdPrefix: com.noondot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: SeekES
    PRODUCT_BUNDLE_IDENTIFIER: com.noondot.SeekES
    INFOPLIST_FILE: ElasticClient/Info-Static.plist
    CODE_SIGN_ENTITLEMENTS: SeekES.entitlements
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  SeekES:
    type: application
    platform: macOS
    sources:
      - path: ElasticClient
        excludes:
          - Info.plist
          - Info-Static.plist
          - "**/*.lproj"
          - Assets.xcassets
      - path: ElasticClient/Assets.xcassets
        buildPhase: resources
      - path: ElasticClient/en.lproj
        buildPhase: resources
      - path: ElasticClient/zh-Hans.lproj
        buildPhase: resources
      - path: ElasticClient/ja.lproj
        buildPhase: resources
      - path: ElasticClient/ko.lproj
        buildPhase: resources
      - path: ElasticClient/ru.lproj
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: ElasticClient/Info-Static.plist
        PRODUCT_NAME: SeekES
        PRODUCT_BUNDLE_IDENTIFIER: com.noondot.SeekES
        CODE_SIGN_ENTITLEMENTS: SeekES.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "-"
    scheme:
      gatherCoverageData: false
      run:
        config: Debug
      archive:
        config: Release
