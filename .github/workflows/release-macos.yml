name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app bundle
        env:
          SKIP_OPEN: "1"
        run: |
          set -euxo pipefail
          uname -a
          swift --version
          swift build -c release
          rm -rf build
          mkdir -p build/SeekES.app/Contents/{MacOS,Resources}
          cp .build/release/SeekES build/SeekES.app/Contents/MacOS/SeekES
          cp ElasticClient/Info-Static.plist build/SeekES.app/Contents/Info.plist
          cp -R ElasticClient/Assets.xcassets build/SeekES.app/Contents/Resources/
          for locale_dir in ElasticClient/*.lproj; do
            [ -d "$locale_dir" ] && cp -R "$locale_dir" build/SeekES.app/Contents/Resources/
          done
          printf 'APPL????' > build/SeekES.app/Contents/PkgInfo
          codesign --force --deep --sign - --entitlements SeekES.entitlements build/SeekES.app

      - name: Verify bundle identifier
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/SeekES.app/Contents/Info.plist)" = "com.github.newpanjing.seekes"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/SeekES.app "SeekES-${GITHUB_REF_NAME}.zip"
          cp "SeekES-${GITHUB_REF_NAME}.zip" SeekES-latest.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SeekES-${{ github.ref_name }}.zip
            SeekES-latest.zip
          generate_release_notes: true
